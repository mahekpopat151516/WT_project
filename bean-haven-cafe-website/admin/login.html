<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Bean Haven</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="login"><div class="login-box"><div class="logo" style="margin-bottom:25px"><span class="logo-mark">☕</span><span><strong>Bean Haven</strong><small>ADMIN</small></span></div><h1>Welcome back</h1><form class="form" id="adminLogin"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn dark">Sign In</button></form><p style="margin-top:15px;color:var(--muted);font-size:12px">Demo login: admin@beanhaven.com / admin123</p></div></div><script>document.querySelector('#adminLogin').addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#email').value==='admin@beanhaven.com'&&document.querySelector('#password').value==='admin123'){location.href='dashboard.html'}else alert('Use the demo credentials shown below.');});</script></body></html>
